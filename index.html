<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00ff88">
    <link rel="manifest" href="manifest.json">
    <title>贪吃蛇大作战 v5.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* 主容器 */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,255,136,0.3);
            letter-spacing: 4px;
        }

        .header .subtitle {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .version-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(255,100,100,0.3), rgba(100,100,255,0.3));
            border-radius: 12px;
            font-size: 12px;
            color: #ffcc88;
            border: 1px solid rgba(255,200,100,0.3);
        }

        /* 游戏信息面板 */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .info-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .info-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .info-card .label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }

        .info-card .value.high {
            color: #ffd700;
        }

        .info-card .value.rank {
            color: #ff6b6b;
        }

        /* 道具状态区域 */
        .powerup-status {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            min-height: 40px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .powerup-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            border: 2px solid;
            font-size: 12px;
            position: relative;
            overflow: hidden;
            animation: powerupPulse 1s ease-in-out infinite;
        }

        @keyframes powerupPulse {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 15px currentColor; }
        }

        .powerup-emoji {
            font-size: 16px;
        }

        .powerup-timer {
            font-weight: bold;
            color: #fff;
            min-width: 24px;
            text-align: center;
        }

        .powerup-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: currentColor;
            transition: width 0.1s linear;
        }

        /* 游戏画布区域 */
        .game-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 0 40px rgba(0,255,136,0.15), inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 16px;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            border-radius: 8px;
            background: #0a0a0f;
        }

        /* 游戏遮罩层 */
        .game-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            border-radius: 8px;
            transition: opacity 0.3s;
        }

        .game-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }

        .powerup-legend {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
            font-size: 11px;
            color: #aaa;
        }

        .powerup-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 游戏模式切换 */
        .game-mode-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }

        .mode-label {
            font-size: 12px;
            color: #888;
        }

        .mode-btn {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
            color: #fff;
            border-color: transparent;
        }

        .btn-primary {
            padding: 14px 48px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,255,136,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,255,136,0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* 控制按钮区 */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .control-btn {
            padding: 12px 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .control-btn.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,255,0.3));
            border-color: #00ff88;
        }

        /* 方向键 */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 200px;
            margin: 0 auto 16px;
        }

        .dpad-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-btn:active {
            background: rgba(0,255,136,0.3);
            transform: scale(0.95);
        }

        .dpad-btn.up { grid-column: 2; }
        .dpad-btn.left { grid-column: 1; grid-row: 2; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; }

        /* 排行榜区域 */
        .leaderboard-section {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .leaderboard-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leaderboard-count {
            font-size: 12px;
            color: #888;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .leaderboard-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .leaderboard-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .leaderboard-empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .leaderboard-item.highlight {
            background: linear-gradient(90deg, rgba(0,255,136,0.2), rgba(0,204,255,0.2));
            border: 1px solid rgba(0,255,136,0.3);
        }

        .rank-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
        }

        .rank-num.gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
        }

        .rank-num.silver {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            color: #000;
        }

        .rank-num.bronze {
            background: linear-gradient(135deg, #cd7f32, #b87333);
            color: #fff;
        }

        .rank-num.normal {
            background: rgba(255,255,255,0.1);
            color: #888;
        }

        .rank-info {
            flex: 1;
        }

        .rank-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .rank-time {
            font-size: 11px;
            color: #666;
        }

        .rank-score {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .final-score {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .final-score.new-record {
            animation: newRecordPulse 1s ease-in-out infinite;
        }

        @keyframes newRecordPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .btn-full {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: transparent;
            color: #888;
            font-size: 14px;
            cursor: pointer;
        }

        .difficulty-select {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .difficulty-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,255,0.3));
            border-color: #00ff88;
            color: #fff;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        /* 云端切换按钮 */
        .cloud-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cloud-toggle-label {
            font-size: 13px;
            color: #888;
        }

        .cloud-toggle-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: #888;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cloud-toggle-btn.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,255,0.3));
            border-color: #00ff88;
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translate(-50%, -50%); }
            to { opacity: 0; transform: translate(-50%, -60%); }
        }

        /* 分数变化动画 */
        .info-card.changed .value {
            animation: scoreChanged 0.3s ease;
        }

        @keyframes scoreChanged {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ffd700; }
            100% { transform: scale(1); }
        }

        /* 响应式 */
        @media (max-height: 700px) {
            .container {
                padding: 12px;
            }
            .header h1 {
                font-size: 24px;
            }
            .dpad {
                max-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>🐍 贪吃蛇</h1>
            <div class="subtitle">SNAKE BATTLE v5.0</div>
            <div class="version-badge">⚡ 道具 + 🤖 AI + 📱 PWA</div>
        </div>

        <!-- 信息面板 -->
        <div class="info-panel">
            <div class="info-card">
                <div class="label">当前分数</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="info-card">
                <div class="label">历史最高</div>
                <div class="value high" id="highScore">0</div>
            </div>
            <div class="info-card">
                <div class="label">我的排名</div>
                <div class="value rank" id="myRank">-</div>
            </div>
        </div>

        <!-- 道具状态显示 -->
        <div class="powerup-bar" id="activePowerups"></div>

        <!-- 游戏画布 -->
        <div class="game-wrapper">
            <canvas id="particleCanvas" width="350" height="350"></canvas>
            <canvas id="gameCanvas" width="350" height="350"></canvas>
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-title">🐍</div>
                <div class="overlay-subtitle">点击开始或使用方向键</div>
                <div class="powerup-legend">
                    <div class="powerup-legend-item"><span>⚡</span> 加速x2</div>
                    <div class="powerup-legend-item"><span>🐌</span> 减速x1.5</div>
                    <div class="powerup-legend-item"><span>🌀</span> 穿墙</div>
                    <div class="powerup-legend-item"><span>💎</span> 双倍x2</div>
                </div>
                <button class="btn-primary" onclick="startGame()">开始游戏</button>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="control-btn active" id="btnEasy" onclick="setDifficulty('easy')">简单</button>
            <button class="control-btn" id="btnNormal" onclick="setDifficulty('normal')">普通</button>
            <button class="control-btn" id="btnHard" onclick="setDifficulty('hard')">困难</button>
            <button class="control-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
        </div>

        <!-- AI对战模式 -->
        <div class="game-mode-toggle">
            <span class="mode-label">游戏模式:</span>
            <button class="mode-btn active" id="modeSolo" onclick="setGameMode('solo')">单人</button>
            <button class="mode-btn" id="modeVsAI" onclick="setGameMode('vs-ai')">对战AI</button>
        </div>

        <!-- 皮肤选择 -->
        <div class="game-mode-toggle">
            <span class="mode-label">皮肤主题:</span>
            <button class="mode-btn active" id="skinClassic" onclick="setSkin('classic')">经典</button>
            <button class="mode-btn" id="skinNeon" onclick="setSkin('neon')">霓虹</button>
            <button class="mode-btn" id="skinFire" onclick="setSkin('fire')">火焰</button>
            <button class="mode-btn" id="skinOcean" onclick="setSkin('ocean')">海洋</button>
        </div>

        <!-- 云端开关 -->
        <div class="cloud-toggle">
            <span class="cloud-toggle-label">排行榜模式:</span>
            <button class="cloud-toggle-btn" id="cloudToggleBtn" onclick="toggleCloud()">📱 本地</button>
        </div>

        <!-- 方向键 -->
        <div class="dpad">
            <button class="dpad-btn up" onclick="handleDirection('up')">⬆️</button>
            <button class="dpad-btn left" onclick="handleDirection('left')">⬅️</button>
            <button class="dpad-btn right" onclick="handleDirection('right')">➡️</button>
            <button class="dpad-btn down" onclick="handleDirection('down')">⬇️</button>
        </div>

        <!-- 排行榜 -->
        <div class="leaderboard-section">
            <div class="leaderboard-header">
                <div class="leaderboard-title">
                    🏆 排行榜
                </div>
                <div class="leaderboard-count" id="leaderboardCount">0 人玩过</div>
            </div>
            <div class="leaderboard-list" id="leaderboardList">
                <div class="leaderboard-empty">
                    <div class="icon">🏆</div>
                    <div>还没有人上榜</div>
                    <div style="font-size: 12px; margin-top: 8px;">成为第一个挑战者吧！</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💥 游戏结束</h2>
            </div>
            <div class="final-score" id="finalScore">0</div>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="请输入你的名字" maxlength="10">
            </div>
            <button class="btn-full" onclick="submitScore()">提交成绩</button>
            <button class="btn-secondary" onclick="closeModal()">暂不提交</button>
        </div>
    </div>

    <!-- 腾讯云开发 SDK -->
    <link rel="stylesheet" href="style.css">
    <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.1.1/cloudbase.full.js"></script>
    <script src="game.js?v=6.2"></script>
</body>
</html>
