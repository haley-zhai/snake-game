<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>贪吃蛇大作战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* 主容器 */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,255,136,0.3);
            letter-spacing: 4px;
        }

        .header .subtitle {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        /* 游戏信息面板 */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .info-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .info-card .label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }

        .info-card .value.high {
            color: #ffd700;
        }

        .info-card .value.rank {
            color: #ff6b6b;
        }

        /* 游戏画布区域 */
        .game-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 0 40px rgba(0,255,136,0.15), inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 16px;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            border-radius: 8px;
            background: #0a0a0f;
        }

        /* 游戏覆盖层 */
        .game-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            border-radius: 8px;
            transition: opacity 0.3s;
        }

        .game-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }

        .btn-primary {
            padding: 14px 48px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,255,136,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,255,136,0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* 控制按钮区域 */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .control-btn {
            padding: 12px 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .control-btn.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,255,0.3));
            border-color: #00ff88;
        }

        /* 方向键 */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 200px;
            margin: 0 auto 16px;
        }

        .dpad-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-btn:active {
            background: rgba(0,255,136,0.3);
            transform: scale(0.95);
        }

        .dpad-btn.up { grid-column: 2; }
        .dpad-btn.left { grid-column: 1; grid-row: 2; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; }

        /* 排行榜区域 */
        .leaderboard-section {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .leaderboard-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leaderboard-count {
            font-size: 12px;
            color: #888;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .leaderboard-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .leaderboard-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .leaderboard-empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .leaderboard-item.highlight {
            background: linear-gradient(90deg, rgba(0,255,136,0.2), rgba(0,204,255,0.2));
            border: 1px solid rgba(0,255,136,0.3);
        }

        .rank-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
        }

        .rank-num.gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
        }

        .rank-num.silver {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            color: #000;
        }

        .rank-num.bronze {
            background: linear-gradient(135deg, #cd7f32, #b87333);
            color: #fff;
        }

        .rank-num.normal {
            background: rgba(255,255,255,0.1);
            color: #888;
        }

        .rank-info {
            flex: 1;
        }

        .rank-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .rank-time {
            font-size: 11px;
            color: #666;
        }

        .rank-score {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .final-score {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .btn-full {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: transparent;
            color: #888;
            font-size: 14px;
            cursor: pointer;
        }

        .difficulty-select {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .difficulty-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,255,0.3));
            border-color: #00ff88;
            color: #fff;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        /* 响应式 */
        @media (max-height: 700px) {
            .container {
                padding: 12px;
            }
            .header h1 {
                font-size: 24px;
            }
            .dpad {
                max-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>🐍 贪吃蛇</h1>
            <div class="subtitle">SNAKE BATTLE</div>
        </div>

        <!-- 信息面板 -->
        <div class="info-panel">
            <div class="info-card">
                <div class="label">当前分数</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="info-card">
                <div class="label">历史最高</div>
                <div class="value high" id="highScore">0</div>
            </div>
            <div class="info-card">
                <div class="label">我的排名</div>
                <div class="value rank" id="myRank">-</div>
            </div>
        </div>

        <!-- 游戏区域 -->
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="350" height="350"></canvas>
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-title">🐍</div>
                <div class="overlay-subtitle">点击开始或使用方向键</div>
                <button class="btn-primary" onclick="startGame()">开始游戏</button>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="control-btn active" id="btnEasy" onclick="setDifficulty('easy')">简单</button>
            <button class="control-btn" id="btnNormal" onclick="setDifficulty('normal')">普通</button>
            <button class="control-btn" id="btnHard" onclick="setDifficulty('hard')">困难</button>
            <button class="control-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
        </div>

        <!-- 方向键 -->
        <div class="dpad">
            <button class="dpad-btn up" onclick="handleDirection('up')">▲</button>
            <button class="dpad-btn left" onclick="handleDirection('left')">◀</button>
            <button class="dpad-btn right" onclick="handleDirection('right')">▶</button>
            <button class="dpad-btn down" onclick="handleDirection('down')">▼</button>
        </div>

        <!-- 排行榜 -->
        <div class="leaderboard-section">
            <div class="leaderboard-header">
                <div class="leaderboard-title">
                    🏆 排行榜
                </div>
                <div class="leaderboard-count" id="leaderboardCount">0 人玩过</div>
            </div>
            <div class="leaderboard-list" id="leaderboardList">
                <div class="leaderboard-empty">
                    <div class="icon">🏆</div>
                    <div>还没有人上榜</div>
                    <div style="font-size: 12px; margin-top: 8px;">成为第一个挑战者吧！</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束模态框 -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💥 游戏结束</h2>
            </div>
            <div class="final-score" id="finalScore">0</div>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="输入你的名字" maxlength="10">
            </div>
            <button class="btn-full" onclick="submitScore()">提交成绩</button>
            <button class="btn-secondary" onclick="closeModal()">暂不提交</button>
        </div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 适配高DPI
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = 350 * dpr;
        canvas.height = 350 * dpr;
        ctx.scale(dpr, dpr);
        canvas.style.width = '100%';
        
        const gridSize = 20;
        const tileCount = 350 / gridSize;

        const difficulties = {
            easy: { speed: 150, label: '简单' },
            normal: { speed: 100, label: '普通' },
            hard: { speed: 60, label: '困难' }
        };

        // ==================== 游戏状态 ====================
        let snake = [];
        let food = {};
        let dx = 0, dy = 0;
        let score = 0;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let isGameStarted = false;
        let difficulty = 'easy';
        let soundEnabled = true;
        let currentSpeed = difficulties.easy.speed;
        let directionQueue = [];
        let currentPlayerName = '';

        // ==================== 音频系统 ====================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'eat') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'die') {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'start') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        function vibrate(ms = 30) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // ==================== 存储管理 ====================
        const STORAGE_KEY = 'snakeGame_v4';
        
        function getGameData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : { scores: [], highScore: 0, playerName: '' };
            } catch (e) {
                return { scores: [], highScore: 0, playerName: '' };
            }
        }

        function saveGameData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getHighScore() {
            return getGameData().highScore;
        }

        function saveHighScore(s) {
            const data = getGameData();
            if (s > data.highScore) {
                data.highScore = s;
                saveGameData(data);
                return true;
            }
            return false;
        }

        function getScores() {
            return getGameData().scores || [];
        }

        function addScore(name, score) {
            const data = getGameData();
            data.scores.push({
                name: name,
                score: score,
                time: Date.now(),
                date: new Date().toLocaleString('zh-CN')
            });
            // 按分数排序，保留前50条
            data.scores.sort((a, b) => b.score - a.score);
            data.scores = data.scores.slice(0, 50);
            data.playerName = name;
            saveGameData(data);
            return data.scores;
        }

        function getPlayerName() {
            return getGameData().playerName || '';
        }

        // ==================== 游戏核心 ====================
        function drawGame() {
            // 背景
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, 350, 350);

            // 网格
            ctx.strokeStyle = 'rgba(0,255,136,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, 350);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(350, i * gridSize);
                ctx.stroke();
            }

            // 蛇
            snake.forEach((seg, i) => {
                const x = seg.x * gridSize;
                const y = seg.y * gridSize;
                
                if (i === 0) {
                    // 蛇头
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff88';
                } else {
                    // 蛇身
                    ctx.fillStyle = `rgba(0,255,136,${0.8 - i * 0.02})`;
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillRect(x + 1, y + 1, gridSize - 2, gridSize - 2);
                
                // 蛇眼
                if (i === 0) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(x + 5, y + 5, 3, 3);
                    ctx.fillRect(x + 12, y + 5, 3, 3);
                }
            });

            ctx.shadowBlur = 0;

            // 食物
            const fx = food.x * gridSize + gridSize/2;
            const fy = food.y * gridSize + gridSize/2;
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(fx, fy, gridSize/2 - 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function updateGame() {
            if (isPaused || isGameOver) return;

            // 处理方向队列
            if (directionQueue.length > 0) {
                const dir = directionQueue.shift();
                dx = dir.dx;
                dy = dir.dy;
            }

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 撞自己检测
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                playSound('eat');
                vibrate(20);
                
                // 加速
                if (score % 50 === 0 && currentSpeed > 50) {
                    currentSpeed -= 5;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, currentSpeed);
                }
                
                placeFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function placeFood() {
            let attempts = 0;
            let f;
            do {
                f = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                attempts++;
            } while (attempts < 100 && snake.some(s => s.x === f.x && s.y === f.y));
            food = f;
        }

        function gameOver() {
            isGameOver = true;
            isGameStarted = false;
            clearInterval(gameLoop);
            playSound('die');
            vibrate([50, 50, 100]);
            
            const isNewRecord = saveHighScore(score);
            document.getElementById('highScore').textContent = getHighScore();
            
            // 显示分数
            document.getElementById('finalScore').textContent = score;
            if (isNewRecord) {
                document.getElementById('finalScore').innerHTML = score + '<div style="font-size:14px;color:#ffd700;margin-top:4px;">🎉 新纪录！</div>';
            }
            
            // 预填充名字
            const savedName = getPlayerName();
            if (savedName) {
                document.getElementById('playerName').value = savedName;
            }
            
            document.getElementById('gameOverModal').classList.add('show');
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            directionQueue = [];
            score = 0;
            isGameOver = false;
            isPaused = false;
            isGameStarted = true;
            currentSpeed = difficulties[difficulty].speed;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('gameOverlay').classList.add('hidden');
            document.getElementById('myRank').textContent = '-';
            
            playSound('start');
            placeFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, currentSpeed);
            drawGame();
        }

        function pauseGame() {
            if (isGameOver || !isGameStarted) return;
            isPaused = !isPaused;
        }

        // ==================== 输入处理 ====================
        function handleDirection(dir) {
            vibrate(15);
            
            if (!isGameStarted && !isGameOver) {
                const dirs = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
                dx = dirs[dir][0];
                dy = dirs[dir][1];
                startGame();
                return;
            }
            
            if (isGameOver || isPaused || !isGameStarted) return;
            
            let newDx = dx, newDy = dy;
            switch(dir) {
                case 'up': if (dy === 0) { newDx = 0; newDy = -1; } break;
                case 'down': if (dy === 0) { newDx = 0; newDy = 1; } break;
                case 'left': if (dx === 0) { newDx = -1; newDy = 0; } break;
                case 'right': if (dx === 0) { newDx = 1; newDy = 0; } break;
            }
            
            if (directionQueue.length < 2 && (newDx !== dx || newDy !== dy)) {
                directionQueue.push({ dx: newDx, dy: newDy });
            }
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
                'w': 'up', 's': 'down', 'a': 'left', 'd': 'right',
                'W': 'up', 'S': 'down', 'A': 'left', 'D': 'right'
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                handleDirection(keyMap[e.key]);
            } else if (e.key === ' ') {
                e.preventDefault();
                if (isGameStarted) pauseGame();
                else startGame();
            }
        });

        // 触摸滑动
        let touchStartX = 0, touchStartY = 0;
        let touchStartTime = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, {passive: true});
        
        document.addEventListener('touchmove', (e) => {
            if (isGameStarted && !isPaused && !isGameOver) {
                e.preventDefault();
            }
        }, {passive: false});
        
        document.addEventListener('touchend', (e) => {
            const touchDuration = Date.now() - touchStartTime;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            
            if (touchDuration < 200 && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                return;
            }
            
            if (Math.abs(dx) < 25 && Math.abs(dy) < 25) return;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                handleDirection(dx > 0 ? 'right' : 'left');
            } else {
                handleDirection(dy > 0 ? 'down' : 'up');
            }
        }, {passive: false});

        // ==================== UI 控制 ====================
        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('show');
            document.getElementById('gameOverlay').classList.remove('hidden');
            updateLeaderboard();
            updateMyRank();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
        }

        function setDifficulty(d) {
            difficulty = d;
            currentSpeed = difficulties[d].speed;
            
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('btn' + d.charAt(0).toUpperCase() + d.slice(1)).classList.add('active');
            
            if (isGameStarted) {
                clearInterval(gameLoop);
                gameLoop = setInterval(updateGame, currentSpeed);
            }
        }

        // ==================== 排行榜 ====================
        function updateLeaderboard() {
            const scores = getScores();
            const listEl = document.getElementById('leaderboardList');
            const countEl = document.getElementById('leaderboardCount');
            
            countEl.textContent = scores.length + ' 人玩过';
            
            if (scores.length === 0) {
                listEl.innerHTML = `
                    <div class="leaderboard-empty">
                        <div class="icon">🏆</div>
                        <div>还没有人上榜</div>
                        <div style="font-size: 12px; margin-top: 8px;">成为第一个挑战者吧！</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            scores.slice(0, 10).forEach((item, i) => {
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
                const isMe = item.name === currentPlayerName && item.score === score;
                
                html += `
                    <div class="leaderboard-item ${isMe ? 'highlight' : ''}">
                        <div class="rank-num ${rankClass}">${i + 1}</div>
                        <div class="rank-info">
                            <div class="rank-name">${escapeHtml(item.name)}</div>
                            <div class="rank-time">${item.date}</div>
                        </div>
                        <div class="rank-score">${item.score}</div>
                    </div>
                `;
            });
            
            listEl.innerHTML = html;
        }

        function updateMyRank() {
            const scores = getScores();
            const myScore = Math.max(score, getHighScore());
            
            if (myScore === 0 || scores.length === 0) {
                document.getElementById('myRank').textContent = '-';
                return;
            }
            
            // 找到当前玩家的最高排名
            const playerName = getPlayerName();
            let myRank = -1;
            
            for (let i = 0; i < scores.length; i++) {
                if (scores[i].name === playerName) {
                    myRank = i + 1;
                    break;
                }
            }
            
            document.getElementById('myRank').textContent = myRank > 0 ? '#' + myRank : '-';
        }

        function submitScore() {
            const name = document.getElementById('playerName').value.trim();
            if (name.length < 1 || name.length > 10) {
                alert('请输入1-10个字符的名字');
                return;
            }
            
            currentPlayerName = name;
            addScore(name, score);
            updateLeaderboard();
            updateMyRank();
            closeModal();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 初始化 ====================
        document.getElementById('highScore').textContent = getHighScore();
        updateLeaderboard();
        updateMyRank();
        drawGame();
    </script>
</body>
</html>
