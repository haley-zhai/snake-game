<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>贪吃蛇大作战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,255,136,0.3);
            letter-spacing: 4px;
        }

        .header .subtitle {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .info-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .info-card .label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }

        .info-card .value.high {
            color: #ffd700;
        }

        .info-card .value.rank {
            color: #ff6b6b;
        }

        .game-wrapper {
            position: relative;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            border: 2px solid rgba(0,255,136,0.2);
            box-shadow: 0 0 30px rgba(0,255,136,0.1);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            border-radius: 8px;
            background: #0a0a0f;
        }

        .game-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            background: rgba(0,0,0,0.85);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .game-overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 64px;
            animation: pulse 2s infinite;
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #888;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .btn-primary {
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,255,136,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,255,136,0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* 控制按钮 */
        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            font-size: 12px;
            color: #888;
            min-width: 36px;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .control-btn {
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            flex: 1;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .control-btn.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,255,0.3));
            border-color: #00ff88;
        }

        .sound-btn {
            min-width: 44px;
            flex: 0;
            font-size: 16px;
        }

        /* 排行榜 */
        .leaderboard-section {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .leaderboard-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leaderboard-count {
            font-size: 12px;
            color: #888;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .leaderboard-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .leaderboard-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .leaderboard-empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .leaderboard-item.highlight {
            background: linear-gradient(90deg, rgba(0,255,136,0.2), rgba(0,204,255,0.2));
            border: 1px solid rgba(0,255,136,0.3);
        }

        .rank-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
        }

        .rank-num.gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
        }

        .rank-num.silver {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            color: #000;
        }

        .rank-num.bronze {
            background: linear-gradient(135deg, #cd7f32, #b87333);
            color: #fff;
        }

        .rank-num.normal {
            background: rgba(255,255,255,0.1);
            color: #888;
        }

        .rank-info {
            flex: 1;
            min-width: 0;
        }

        .rank-name {
            font-weight: 500;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-time {
            font-size: 11px;
            color: #666;
        }

        .rank-score {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            border: 1px solid rgba(0,255,136,0.3);
            box-shadow: 0 0 40px rgba(0,255,136,0.2);
        }

        .modal-header h2 {
            margin-bottom: 16px;
            font-size: 24px;
        }

        .final-score {
            font-size: 48px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 24px;
            text-shadow: 0 0 20px rgba(0,255,136,0.5);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .input-group input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        .btn-full {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-full:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,255,136,0.4);
        }

        .btn-full:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0,255,136,0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,255,136,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>贪吃蛇大作战</h1>
            <div class="subtitle">滑动屏幕或点击开始</div>
        </div>

        <div class="info-panel">
            <div class="info-card">
                <div class="label">得分</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="info-card">
                <div class="label">最高分</div>
                <div class="value high" id="highScore">0</div>
            </div>
            <div class="info-card">
                <div class="label">我的排名</div>
                <div class="value rank" id="myRank">-</div>
            </div>
        </div>

        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-title">🐍</div>
                <div class="overlay-subtitle">点击开始或滑动屏幕</div>
                <button class="btn-primary" onclick="startGame()">开始游戏</button>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls-row">
            <div class="controls-group">
                <span class="control-label">难度</span>
                <div class="controls">
                    <button class="control-btn active" id="btnEasy" onclick="setDifficulty('easy')">简单</button>
                    <button class="control-btn" id="btnNormal" onclick="setDifficulty('normal')">普通</button>
                    <button class="control-btn" id="btnHard" onclick="setDifficulty('hard')">困难</button>
                </div>
            </div>
            <div class="controls-group">
                <span class="control-label">皮肤</span>
                <div class="controls">
                    <button class="control-btn active" id="skinClassic" onclick="setSkin('classic')">经典</button>
                    <button class="control-btn" id="skinNeon" onclick="setSkin('neon')">霓虹</button>
                    <button class="control-btn" id="skinFire" onclick="setSkin('fire')">火焰</button>
                    <button class="control-btn" id="skinOcean" onclick="setSkin('ocean')">海洋</button>
                </div>
            </div>
        </div>

        <button class="control-btn sound-btn" onclick="toggleSound()" id="soundBtn">🔊</button>

        <!-- 排行榜 -->
        <div class="leaderboard-section">
            <div class="leaderboard-header">
                <div class="leaderboard-title">
                    🏆 排行榜
                </div>
                <div class="leaderboard-count" id="leaderboardCount">0 人玩过</div>
            </div>
            <div class="leaderboard-list" id="leaderboardList">
                <div class="leaderboard-empty">
                    <div class="icon">🏆</div>
                    <div>还没有人上榜</div>
                    <div style="font-size: 12px; margin-top: 8px;">成为第一个挑战者吧！</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💥 游戏结束</h2>
            </div>
            <div class="final-score" id="finalScore">0</div>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="请输入你的名字" maxlength="10">
            </div>
            <button class="btn-full" onclick="submitScore()">提交成绩</button>
        </div>
    </div>

    <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.1.1/cloudbase.full.js"></script>
    <script src="game.js?v=6.4"></script>
</body>
</html>
