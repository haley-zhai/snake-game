<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇大作战 v7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== 首页 ===== */
        .home-page { text-align: center; padding: 40px 20px; }
        .home-title {
            font-size: 42px; font-weight: 900;
            background: linear-gradient(90deg, #00ff88, #00ccff, #00ff88);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes shine { to { background-position: 200% center; } }
        .home-subtitle { color: #888; font-size: 14px; margin-bottom: 40px; }
        .btn-main {
            display: block; width: 80%; margin: 0 auto 16px;
            padding: 18px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 16px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,255,136,0.3);
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.96); }
        .btn-secondary {
            display: block; width: 80%; margin: 0 auto 12px;
            padding: 14px; font-size: 16px;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 14px;
            background: rgba(255,255,255,0.05); color: #fff; cursor: pointer;
        }
        .home-stats {
            display: grid; grid-template-columns: repeat(3,1fr); gap: 12px;
            margin: 30px auto; max-width: 320px;
        }
        .stat-box {
            background: rgba(255,255,255,0.03); border-radius: 12px;
            padding: 16px 8px; border: 1px solid rgba(255,255,255,0.08);
        }
        .stat-box .num { font-size: 22px; font-weight: bold; color: #00ff88; }
        .stat-box .label { font-size: 11px; color: #666; margin-top: 4px; }

        /* ===== 模式选择 ===== */
        .mode-page { padding: 20px; }
        .page-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 24px; padding-top: 8px;
        }
        .btn-back {
            width: 40px; height: 40px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05); color: #fff;
            font-size: 20px; cursor: pointer;
        }
        .page-title { font-size: 22px; font-weight: bold; }
        .mode-card {
            background: rgba(255,255,255,0.03); border-radius: 16px;
            padding: 24px; margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer; transition: all 0.2s;
            text-align: left;
        }
        .mode-card:hover, .mode-card:active {
            border-color: #00ff88;
            background: rgba(0,255,136,0.05);
        }
        .mode-card .icon { font-size: 36px; margin-bottom: 8px; }
        .mode-card .name { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
        .mode-card .desc { font-size: 13px; color: #888; }

        /* ===== 游戏页 ===== */
        .game-page { padding: 12px; }
        .game-topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .game-info-bar {
            display: flex; gap: 12px;
        }
        .game-info-pill {
            background: rgba(255,255,255,0.05); border-radius: 20px;
            padding: 6px 14px; font-size: 13px; border: 1px solid rgba(255,255,255,0.1);
        }
        .game-info-pill .val { color: #00ff88; font-weight: bold; margin-left: 4px; }
        .game-btns {
            display: flex; gap: 8px;
        }
        .game-btn {
            width: 36px; height: 36px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05); color: #fff;
            font-size: 16px; cursor: pointer;
        }
        .game-area {
            position: relative; border-radius: 16px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(0,255,136,0.2);
            overflow: hidden;
        }
        #gameCanvas { display: block; width: 100%; background: #0a0a0f; }
        .game-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
            border-radius: 14px;
        }
        .game-overlay.hidden { display: none; }

        /* 道具栏 */
        .powerup-bar {
            display: flex; gap: 8px; margin: 12px 0;
            min-height: 40px;
        }
        .powerup-badge {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; position: relative;
        }
        .powerup-badge.active {
            border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        .powerup-badge .timer {
            position: absolute; bottom: -2px; right: -2px;
            background: #ff6b6b; color: #fff; font-size: 10px;
            padding: 1px 4px; border-radius: 4px;
        }

        /* 虚拟方向键 */
        .dpad {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 4px; max-width: 200px; margin: 16px auto;
        }
        .dpad-btn {
            aspect-ratio: 1; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08); color: #fff;
            font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        .dpad-btn:active { background: rgba(0,255,136,0.2); border-color: #00ff88; }
        .dpad-empty { pointer-events: none; }

        /* ===== 结算页 ===== */
        .result-page { padding: 40px 20px; text-align: center; }
        .result-emoji { font-size: 64px; margin-bottom: 16px; }
        .result-score { font-size: 56px; font-weight: 900; color: #00ff88; margin-bottom: 8px; }
        .result-label { color: #888; font-size: 14px; margin-bottom: 24px; }
        .result-details {
            background: rgba(255,255,255,0.03); border-radius: 16px;
            padding: 20px; margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .result-row {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .result-row:last-child { border: none; }
        .result-row .k { color: #888; }
        .result-row .v { font-weight: bold; }
        #playerNameInput {
            width: 100%; padding: 14px; margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
            background: rgba(255,255,255,0.05); color: #fff;
            font-size: 16px; text-align: center;
        }

        /* ===== 排行榜 ===== */
        .lb-page { padding: 20px; }
        .lb-tabs {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .lb-tab {
            flex: 1; padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03); color: #888;
            cursor: pointer; font-size: 13px; text-align: center;
        }
        .lb-tab.active {
            border-color: #00ff88; color: #00ff88;
            background: rgba(0,255,136,0.08);
        }
        .lb-list { min-height: 300px; }
        .lb-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; background: rgba(255,255,255,0.03);
            border-radius: 10px; margin-bottom: 8px;
        }
        .lb-rank {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 13px; flex-shrink: 0;
        }
        .lb-rank.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
        .lb-rank.silver { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #000; }
        .lb-rank.bronze { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; }
        .lb-rank.other { background: rgba(255,255,255,0.08); color: #888; }
        .lb-name { flex: 1; }
        .lb-score { font-weight: bold; color: #00ff88; }
        .lb-empty { text-align: center; padding: 60px 20px; color: #555; }

        /* ===== 设置页 ===== */
        .settings-page { padding: 20px; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .setting-row .label { font-size: 15px; }
        .setting-row .desc { font-size: 12px; color: #666; margin-top: 2px; }
        .toggle {
            width: 50px; height: 28px; border-radius: 14px;
            background: #333; position: relative; cursor: pointer;
            transition: background 0.2s;
        }
        .toggle.on { background: #00ff88; }
        .toggle::after {
            content: ''; position: absolute; width: 24px; height: 24px;
            border-radius: 50%; background: #fff; top: 2px; left: 2px;
            transition: transform 0.2s;
        }
        .toggle.on::after { transform: translateX(22px); }

        /* 通用 */
        .btn { border: none; cursor: pointer; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
        .float-score {
            position: absolute; font-weight: bold; font-size: 18px;
            color: #00ff88; pointer-events: none; z-index: 10;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }

        /* 暂停遮罩 */
        .pause-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.7);
            display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
            border-radius: 14px; z-index: 5;
        }
        .pause-overlay.show { display: flex; }
    </style>
</head>
<body>
    <div class="app">
        <!-- ========== 首页 ========== -->
        <div class="page home-page active" id="page-home">
            <div class="home-title">🐍 贪吃蛇</div>
            <div class="home-subtitle">大作战 v7</div>

            <button class="btn-main" onclick="showPage('page-mode')">▶ 开始游戏</button>
            <button class="btn-secondary" onclick="showPage('page-leaderboard')">🏆 排行榜</button>
            <button class="btn-secondary" onclick="showPage('page-settings')">⚙️ 设置</button>

            <div class="home-stats">
                <div class="stat-box">
                    <div class="num" id="stat-high">0</div>
                    <div class="label">最高分</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="stat-plays">0</div>
                    <div class="label">游戏次数</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="stat-total">0</div>
                    <div class="label">累计分数</div>
                </div>
            </div>
        </div>

        <!-- ========== 模式选择 ========== -->
        <div class="page mode-page" id="page-mode">
            <div class="page-header">
                <button class="btn-back" onclick="showPage('page-home')">←</button>
                <div class="page-title">选择模式</div>
            </div>
            <div class="mode-card" onclick="startGame('classic')">
                <div class="icon">🎯</div>
                <div class="name">经典模式</div>
                <div class="desc">传统玩法，撞墙即死，挑战你的极限长度</div>
            </div>
            <div class="mode-card" onclick="startGame('wall')">
                <div class="icon">🌀</div>
                <div class="name">穿墙模式</div>
                <div class="desc">撞墙从对面穿出，专注吃食物变长</div>
            </div>
            <div class="mode-card" onclick="startGame('timed')">
                <div class="icon">⏱️</div>
                <div class="name">限时挑战</div>
                <div class="desc">60秒倒计时，疯狂吃食物拿高分</div>
            </div>
        </div>

        <!-- ========== 游戏页 ========== -->
        <div class="page game-page" id="page-game">
            <div class="game-topbar">
                <div class="game-info-bar">
                    <div class="game-info-pill">得分<span class="val" id="g-score">0</span></div>
                    <div class="game-info-pill" id="time-pill" style="display:none">时间<span class="val" id="g-time">60</span></div>
                </div>
                <div class="game-btns">
                    <button class="game-btn" onclick="togglePause()" id="btn-pause">⏸</button>
                    <button class="game-btn" onclick="quitGame()">✕</button>
                </div>
            </div>

            <div class="powerup-bar" id="powerup-bar"></div>

            <div class="game-area" id="game-area">
                <canvas id="gameCanvas"></canvas>
                <div class="game-overlay" id="game-overlay">
                    <div style="font-size: 60px;">🐍</div>
                    <div style="color: #888;">点击或滑动开始</div>
                    <button class="btn-main" style="width:auto;padding:14px 36px" onclick="resumeGame()">开始</button>
                </div>
                <div class="pause-overlay" id="pause-overlay">
                    <div style="font-size: 48px;">⏸</div>
                    <div style="color: #888; margin-bottom: 8px">游戏暂停</div>
                    <button class="btn-main" style="width:auto;padding:12px 30px" onclick="togglePause()">继续</button>
                    <button class="btn-secondary" style="width:auto;padding:10px 24px" onclick="quitGame()">退出</button>
                </div>
            </div>

            <div class="dpad" id="dpad">
                <div class="dpad-empty"></div>
                <button class="dpad-btn" data-dir="up">▲</button>
                <div class="dpad-empty"></div>
                <button class="dpad-btn" data-dir="left">◀</button>
                <div class="dpad-empty"></div>
                <button class="dpad-btn" data-dir="right">▶</button>
                <div class="dpad-empty"></div>
                <button class="dpad-btn" data-dir="down">▼</button>
                <div class="dpad-empty"></div>
            </div>
        </div>

        <!-- ========== 结算页 ========== -->
        <div class="page result-page" id="page-result">
            <div class="result-emoji" id="result-emoji">💥</div>
            <div class="result-score" id="result-score">0</div>
            <div class="result-label">本局得分</div>

            <div class="result-details">
                <div class="result-row"><span class="k">游戏模式</span><span class="v" id="r-mode">-</span></div>
                <div class="result-row"><span class="k">蛇身长度</span><span class="v" id="r-length">-</span></div>
                <div class="result-row"><span class="k">吃食物数</span><span class="v" id="r-food">-</span></div>
                <div class="result-row"><span class="k">用时</span><span class="v" id="r-time">-</span></div>
                <div class="result-row"><span class="k">最高连击</span><span class="v" id="r-combo">-</span></div>
                <div class="result-row"><span class="k">新纪录</span><span class="v" id="r-record" style="color:#ffd700">-</span></div>
            </div>

            <input type="text" id="playerNameInput" placeholder="输入名字提交排行榜" maxlength="10">
            <button class="btn-main" onclick="submitScore()">提交成绩</button>
            <button class="btn-secondary" onclick="startGame(currentMode)">再来一局</button>
            <button class="btn-secondary" onclick="showPage('page-home')">返回首页</button>
        </div>

        <!-- ========== 排行榜 ========== -->
        <div class="page lb-page" id="page-leaderboard">
            <div class="page-header">
                <button class="btn-back" onclick="showPage('page-home')">←</button>
                <div class="page-title">🏆 排行榜</div>
            </div>
            <div class="lb-tabs">
                <button class="lb-tab active" data-period="all" onclick="switchLb('all')">全部</button>
                <button class="lb-tab" data-period="week" onclick="switchLb('week')">本周</button>
                <button class="lb-tab" data-period="today" onclick="switchLb('today')">今日</button>
            </div>
            <div class="lb-list" id="lb-list">
                <div class="lb-empty">加载中...</div>
            </div>
        </div>

        <!-- ========== 设置页 ========== -->
        <div class="page settings-page" id="page-settings">
            <div class="page-header">
                <button class="btn-back" onclick="showPage('page-home')">←</button>
                <div class="page-title">⚙️ 设置</div>
            </div>

            <div class="setting-row">
                <div>
                    <div class="label">音效</div>
                    <div class="desc">吃食物、游戏结束音效</div>
                </div>
                <div class="toggle" id="toggle-sound" onclick="toggleSetting('sound')"></div>
            </div>
            <div class="setting-row">
                <div>
                    <div class="label">振动反馈</div>
                    <div class="desc">吃食物时手机振动</div>
                </div>
                <div class="toggle on" id="toggle-vibrate" onclick="toggleSetting('vibrate')"></div>
            </div>
            <div class="setting-row">
                <div>
                    <div class="label">穿墙模式</div>
                    <div class="desc">默认开启穿墙（经典模式也生效）</div>
                </div>
                <div class="toggle" id="toggle-wall" onclick="toggleSetting('wall')"></div>
            </div>
            <div class="setting-row">
                <div>
                    <div class="label">虚拟方向键</div>
                    <div class="desc">屏幕显示方向按钮</div>
                </div>
                <div class="toggle on" id="toggle-dpad" onclick="toggleSetting('dpad')"></div>
            </div>
            <div class="setting-row">
                <div>
                    <div class="label">难度预设</div>
                    <div class="desc">影响移动速度</div>
                </div>
                <div style="display:flex;gap:6px">
                    <button class="btn-secondary" style="width:auto;padding:6px 12px;font-size:13px" id="diff-easy" onclick="setDifficulty('easy')">简单</button>
                    <button class="btn-secondary" style="width:auto;padding:6px 12px;font-size:13px" id="diff-normal" onclick="setDifficulty('normal')">普通</button>
                    <button class="btn-secondary" style="width:auto;padding:6px 12px;font-size:13px" id="diff-hard" onclick="setDifficulty('hard')">困难</button>
                </div>
            </div>

            <button class="btn-secondary" style="margin-top: 30px; color: #ff6b6b; border-color: rgba(255,107,107,0.3)" onclick="clearData()">
                🗑️ 清除所有数据
            </button>
        </div>
    </div>

    <div class="particles" id="particles"></div>

    <script>
    // ========== API 配置 ==========
    const API_BASE = 'http://134.175.187.78:3000';

    // ========== 游戏配置 ==========
    const GRID_SIZE = 20;
    const TILE_COUNT = 17;
    const CANVAS_SIZE = GRID_SIZE * TILE_COUNT; // 340px

    const speeds = { easy: 150, normal: 100, hard: 60 };
    const modeNames = { classic: '经典模式', wall: '穿墙模式', timed: '限时挑战' };

    // ========== 全局状态 ==========
    let currentPage = 'page-home';
    let currentMode = 'classic';
    let difficulty = 'normal';
    let settings = {};
    let leaderboardData = [];

    // 游戏运行态
    let snake = [], food = {}, dx = 1, dy = 0, score = 0;
    let gameRunning = false, gamePaused = false, gameOverFlag = false;
    let animFrame = null, lastTime = 0, accTime = 0;
    let gameStartTime = 0, foodEaten = 0, maxCombo = 0, currentCombo = 0;
    let powerups = [], activePowerups = {};
    let timedRemaining = 60, timedInterval = null;

    // ========== 页面切换 ==========
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        currentPage = id;
        if (id === 'page-home') updateHomeStats();
        if (id === 'page-leaderboard') loadLeaderboard('all');
        if (id === 'page-settings') renderSettings();
    }

    // ========== 设置管理 ==========
    function loadSettings() {
        const s = localStorage.getItem('snakeSettings');
        settings = s ? JSON.parse(s) : { sound: false, vibrate: true, wall: false, dpad: true };
        if (!settings.difficulty) settings.difficulty = 'normal';
        difficulty = settings.difficulty;
    }
    function saveSettings() {
        settings.difficulty = difficulty;
        localStorage.setItem('snakeSettings', JSON.stringify(settings));
    }
    function toggleSetting(key) {
        settings[key] = !settings[key];
        saveSettings();
        renderSettings();
    }
    function setDifficulty(d) {
        difficulty = d;
        saveSettings();
        renderSettings();
    }
    function renderSettings() {
        ['sound','vibrate','wall','dpad'].forEach(k => {
            const el = document.getElementById('toggle-' + k);
            if (el) el.classList.toggle('on', !!settings[k]);
        });
        document.querySelectorAll('[id^="diff-"]').forEach(b => b.style.borderColor = 'rgba(255,255,255,0.2)');
        const diffBtn = document.getElementById('diff-' + difficulty);
        if (diffBtn) diffBtn.style.borderColor = '#00ff88';

        const dpad = document.getElementById('dpad');
        if (dpad) dpad.style.display = settings.dpad ? 'grid' : 'none';
    }
    function clearData() {
        if (!confirm('确定要清除所有本地数据吗？')) return;
        localStorage.removeItem('snakeHigh');
        localStorage.removeItem('snakeStats');
        localStorage.removeItem('snakeSettings');
        loadSettings();
        updateHomeStats();
        alert('已清除');
    }

    // ========== 数据统计 ==========
    function getStats() {
        const s = localStorage.getItem('snakeStats');
        return s ? JSON.parse(s) : { plays: 0, total: 0, high: 0 };
    }
    function saveStats(s) {
        localStorage.setItem('snakeStats', JSON.stringify(s));
    }
    function updateHomeStats() {
        const s = getStats();
        document.getElementById('stat-high').textContent = s.high;
        document.getElementById('stat-plays').textContent = s.plays;
        document.getElementById('stat-total').textContent = s.total;
    }

    // ========== Canvas 初始化 ==========
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let dpr = 1;

    function setupCanvas() {
        dpr = window.devicePixelRatio || 1;
        const cssSize = Math.min(window.innerWidth - 48, 440);
        const size = Math.floor(cssSize / GRID_SIZE) * GRID_SIZE;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ========== 食物与道具类型 ==========
    const foodTypes = {
        normal: { color: '#ff6b6b', glow: '#ff6b6b', score: 10, chance: 0.7, emoji: '' },
        gold:   { color: '#ffd700', glow: '#ffd700', score: 20, chance: 0.2, emoji: '' },
        rainbow:{ color: '#ff00ff', glow: '#00ffff', score: 50, chance: 0.1, emoji: '' }
    };

    const powerupTypes = {
        shield:  { emoji: '🛡️', color: '#4dabf7', duration: 8000, name: '护盾' },
        double:  { emoji: '⭐', color: '#ffd700', duration: 10000, name: '双倍' },
        speed:   { emoji: '⚡', color: '#ffa94d', duration: 5000, name: '加速' },
        magnet:  { emoji: '🧲', color: '#e64980', duration: 8000, name: '磁铁' }
    };

    // ========== 游戏启动 ==========
    function startGame(mode) {
        currentMode = mode;
        showPage('page-game');
        setupCanvas();

        // 初始化蛇
        const mid = Math.floor(TILE_COUNT / 2);
        snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
        dx = 1; dy = 0;
        score = 0; foodEaten = 0; maxCombo = 0; currentCombo = 0;
        powerups = []; activePowerups = {};

        // 穿墙模式判断
        const wallEnabled = mode === 'wall' || settings.wall;

        // 限时模式
        if (mode === 'timed') {
            timedRemaining = 60;
            document.getElementById('time-pill').style.display = '';
            timedInterval = setInterval(() => {
                if (!gamePaused && gameRunning) {
                    timedRemaining--;
                    document.getElementById('g-time').textContent = timedRemaining;
                    if (timedRemaining <= 0) endGame('timeup');
                }
            }, 1000);
        } else {
            document.getElementById('time-pill').style.display = 'none';
        }

        placeFood();
        placePowerup();

        document.getElementById('g-score').textContent = '0';
        document.getElementById('game-overlay').classList.remove('hidden');
        document.getElementById('pause-overlay').classList.remove('show');

        renderPowerups();
        draw();

        gameRunning = false;
        gamePaused = false;
        gameOverFlag = false;
    }

    function resumeGame() {
        if (gameOverFlag) return;
        if (gameRunning) return;
        document.getElementById('game-overlay').classList.add('hidden');
        gameRunning = true;
        gameStartTime = Date.now();
        lastTime = performance.now();
        accTime = 0;
        gameLoop();
    }

    function quitGame() {
        gameRunning = false; gamePaused = false; gameOverFlag = true;
        if (animFrame) cancelAnimationFrame(animFrame);
        if (timedInterval) { clearInterval(timedInterval); timedInterval = null; }
        showPage('page-home');
    }

    function togglePause() {
        if (!gameRunning || gameOverFlag) return;
        gamePaused = !gamePaused;
        document.getElementById('pause-overlay').classList.toggle('show', gamePaused);
        document.getElementById('btn-pause').textContent = gamePaused ? '▶' : '⏸';
        if (!gamePaused) {
            lastTime = performance.now();
            gameLoop();
        }
    }

    // ========== 游戏主循环 ==========
    function gameLoop() {
        if (!gameRunning || gamePaused || gameOverFlag) return;
        animFrame = requestAnimationFrame(gameLoop);

        const now = performance.now();
        const dt = now - lastTime;
        lastTime = now;

        // 计算实际速度（受加速道具和难度影响）
        let moveInterval = speeds[difficulty];
        if (activePowerups.speed) moveInterval *= 0.6;
        if (activePowerups.double) moveInterval *= 0.9;

        accTime += dt;
        if (accTime < moveInterval) return;
        accTime = 0;

        update();
    }

    function update() {
        if (!gameRunning || gameOverFlag) return;

        // 更新道具倒计时
        const now = Date.now();
        for (const key in activePowerups) {
            if (activePowerups[key].endTime <= now) {
                delete activePowerups[key];
            }
        }
        renderPowerups();

        // 磁铁效果：自动朝食物移动
        let moveDx = dx, moveDy = dy;
        if (activePowerups.magnet && food.x !== undefined) {
            const head = snake[0];
            const distX = food.x - head.x;
            const distY = food.y - head.y;
            if (Math.abs(distX) > Math.abs(distY)) {
                if (distX !== 0 && !(distX < 0 && dx === 1) && !(distX > 0 && dx === -1)) {
                    moveDx = distX > 0 ? 1 : -1; moveDy = 0;
                }
            } else {
                if (distY !== 0 && !(distY < 0 && dy === 1) && !(distY > 0 && dy === -1)) {
                    moveDx = 0; moveDy = distY > 0 ? 1 : -1;
                }
            }
        }

        const head = { x: snake[0].x + moveDx, y: snake[0].y + moveDy };

        // 穿墙处理
        const wallEnabled = currentMode === 'wall' || settings.wall || activePowerups.shield;
        let died = false;

        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
            if (currentMode === 'wall' || settings.wall) {
                head.x = (head.x + TILE_COUNT) % TILE_COUNT;
                head.y = (head.y + TILE_COUNT) % TILE_COUNT;
            } else if (activePowerups.shield) {
                // 护盾消耗掉，允许穿墙一次
                head.x = (head.x + TILE_COUNT) % TILE_COUNT;
                head.y = (head.y + TILE_COUNT) % TILE_COUNT;
                delete activePowerups.shield;
                renderPowerups();
                showFloat(canvas.offsetLeft + head.x * GRID_SIZE + GRID_SIZE/2, canvas.offsetTop + head.y * GRID_SIZE, '🛡️ 护盾消耗!', '#4dabf7');
            } else {
                died = true;
            }
        }

        // 撞自己
        if (!died) {
            for (let seg of snake) {
                if (head.x === seg.x && head.y === seg.y) {
                    died = true; break;
                }
            }
        }

        if (died) {
            endGame('crash');
            return;
        }

        snake.unshift(head);

        // 吃食物
        let ate = false;
        if (head.x === food.x && head.y === food.y) {
            ate = true;
            let pts = foodTypes[food.type].score;
            if (activePowerups.double) pts *= 2;
            score += pts;
            foodEaten++;
            currentCombo++;
            if (currentCombo > maxCombo) maxCombo = currentCombo;

            // 连击加分
            if (currentCombo >= 5) pts += 5;
            if (currentCombo >= 10) pts += 10;

            document.getElementById('g-score').textContent = score;
            showFloat(canvas.offsetLeft + head.x * GRID_SIZE + GRID_SIZE/2, canvas.offsetTop + head.y * GRID_SIZE, '+' + pts, '#00ff88');
            spawnParticles(head.x * GRID_SIZE + GRID_SIZE/2, head.y * GRID_SIZE + GRID_SIZE/2, foodTypes[food.type].color);
            playSound('eat');
            vibrate(15);

            placeFood();
            // 彩虹食物附带随机道具
            if (food.type === 'rainbow') {
                const keys = Object.keys(powerupTypes);
                const randomKey = keys[Math.floor(Math.random() * keys.length)];
                grantPowerup(randomKey);
            }
        } else {
            snake.pop();
            if (!ate) currentCombo = 0;
        }

        // 吃道具
        for (let i = powerups.length - 1; i >= 0; i--) {
            const p = powerups[i];
            if (head.x === p.x && head.y === p.y) {
                grantPowerup(p.type);
                powerups.splice(i, 1);
                playSound('powerup');
                vibrate(30);
                showFloat(canvas.offsetLeft + p.x * GRID_SIZE + GRID_SIZE/2, canvas.offsetTop + p.y * GRID_SIZE, powerupTypes[p.type].emoji + ' ' + powerupTypes[p.type].name + '!', powerupTypes[p.type].color);
                setTimeout(placePowerup, 8000);
            }
        }

        draw();
    }

    function endGame(reason) {
        gameRunning = false; gameOverFlag = true;
        if (animFrame) cancelAnimationFrame(animFrame);
        if (timedInterval) { clearInterval(timedInterval); timedInterval = null; }

        const playTime = Math.floor((Date.now() - gameStartTime) / 1000);
        const stats = getStats();
        const isNewRecord = score > stats.high;
        stats.plays++;
        stats.total += score;
        if (score > stats.high) stats.high = score;
        saveStats(stats);

        // 死亡动画
        spawnDeathParticles();
        setTimeout(() => {
            document.getElementById('result-emoji').textContent = reason === 'timeup' ? '⏰' : '💥';
            document.getElementById('result-score').textContent = score;
            document.getElementById('r-mode').textContent = modeNames[currentMode];
            document.getElementById('r-length').textContent = snake.length;
            document.getElementById('r-food').textContent = foodEaten;
            document.getElementById('r-time').textContent = playTime + '秒';
            document.getElementById('r-combo').textContent = maxCombo + '连击';
            document.getElementById('r-record').textContent = isNewRecord ? '✨ 是!' : '否';
            document.getElementById('playerNameInput').value = '';
            showPage('page-result');
        }, 600);
    }

    // ========== 绘制 ==========
    let foodPulse = 0;
    function draw() {
        const w = canvas.width / dpr, h = canvas.height / dpr;
        ctx.clearRect(0, 0, w, h);

        // 背景
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, w, h);

        // 动态背景粒子
        drawBgParticles(w, h);

        // 网格
        ctx.strokeStyle = 'rgba(0,255,136,0.04)';
        ctx.lineWidth = 0.5;
        const step = w / TILE_COUNT;
        for (let i = 0; i <= TILE_COUNT; i++) {
            ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(w, i * step); ctx.stroke();
        }

        // 食物呼吸动画
        foodPulse += 0.05;
        const pulseScale = 1 + Math.sin(foodPulse) * 0.1;

        // 食物
        if (food.x !== undefined) {
            const ft = foodTypes[food.type] || foodTypes.normal;
            const fx = food.x * step + step/2;
            const fy = food.y * step + step/2;
            const r = (step/2 - 3) * pulseScale;
            ctx.fillStyle = ft.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = ft.glow;
            ctx.beginPath();
            ctx.arc(fx, fy, Math.max(r, 3), 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 食物光泽
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(fx - r*0.3, fy - r*0.3, r*0.35, 0, Math.PI * 2);
            ctx.fill();
        }

        // 道具
        powerups.forEach(p => {
            const pt = powerupTypes[p.type];
            const px = p.x * step + step/2;
            const py = p.y * step + step/2;
            ctx.fillStyle = pt.color;
            ctx.globalAlpha = 0.3 + Math.sin(foodPulse * 1.5 + p.x) * 0.2;
            ctx.fillRect(p.x * step + 2, p.y * step + 2, step - 4, step - 4);
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 8;
            ctx.shadowColor = pt.color;
            ctx.fillStyle = '#fff';
            ctx.font = (step * 0.7) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(pt.emoji, px, py);
            ctx.shadowBlur = 0;
        });

        // 蛇
        snake.forEach((seg, i) => {
            const x = seg.x * step, y = seg.y * step;
            const isHead = i === 0;
            const alpha = isHead ? 1 : Math.max(0.3, 0.9 - i * 0.04);
            const size = isHead ? step - 2 : step - 4;
            const offset = isHead ? 1 : 2;

            // 蛇身颜色渐变
            const hue = 140 + Math.sin(i * 0.15) * 20;
            const color = isHead ? '#00ff88' : `hsla(${hue}, 80%, 55%, ${alpha})`;

            ctx.fillStyle = color;
            if (isHead) {
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00ff88';
            }
            ctx.beginPath();
            roundRect(ctx, x + offset, y + offset, size, size, 4);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 蛇头眼睛
            if (isHead) {
                ctx.fillStyle = '#000';
                const ex = dx === 1 ? 0.7 : dx === -1 ? 0.3 : 0.5;
                const ey = dy === 1 ? 0.7 : dy === -1 ? 0.3 : 0.5;
                const eyeR = step * 0.15;
                ctx.beginPath();
                ctx.arc(x + step * ex, y + step * ey, eyeR, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }

    function roundRect(ctx, x, y, w, h, r) {
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    let bgParticles = [];
    function initBgParticles() {
        bgParticles = [];
        for (let i = 0; i < 20; i++) {
            bgParticles.push({
                x: Math.random(), y: Math.random(),
                size: 1 + Math.random() * 2,
                speed: 0.0002 + Math.random() * 0.0005,
                alpha: 0.1 + Math.random() * 0.2
            });
        }
    }
    function drawBgParticles(w, h) {
        bgParticles.forEach(p => {
            p.y -= p.speed;
            if (p.y < 0) { p.y = 1; p.x = Math.random(); }
            ctx.fillStyle = `rgba(0,255,136,${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x * w, p.y * h, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // ========== 生成食物/道具 ==========
    function placeFood() {
        const rand = Math.random();
        let type = 'normal';
        if (rand > 0.9) type = 'rainbow';
        else if (rand > 0.7) type = 'gold';

        let f;
        do {
            f = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT), type };
        } while (isOccupied(f.x, f.y));
        food = f;
    }

    function placePowerup() {
        if (powerups.length >= 2) return;
        if (Math.random() > 0.4) return;
        const keys = Object.keys(powerupTypes);
        const type = keys[Math.floor(Math.random() * keys.length)];
        let p;
        do {
            p = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT), type };
        } while (isOccupied(p.x, p.y));
        powerups.push(p);
    }

    function isOccupied(x, y) {
        if (food.x === x && food.y === y) return true;
        if (snake.some(s => s.x === x && s.y === y)) return true;
        if (powerups.some(p => p.x === x && p.y === y)) return true;
        return false;
    }

    function grantPowerup(type) {
        const pt = powerupTypes[type];
        activePowerups[type] = { endTime: Date.now() + pt.duration };
        renderPowerups();
    }

    function renderPowerups() {
        const bar = document.getElementById('powerup-bar');
        const now = Date.now();
        const html = Object.entries(activePowerups).map(([key, p]) => {
            const pt = powerupTypes[key];
            const sec = Math.ceil((p.endTime - now) / 1000);
            return `<div class="powerup-badge active">${pt.emoji}<span class="timer">${sec}s</span></div>`;
        }).join('');
        bar.innerHTML = html;
    }

    // ========== 粒子与动效 ==========
    function spawnParticles(cx, cy, color) {
        const container = document.getElementById('particles');
        for (let i = 0; i < 12; i++) {
            const el = document.createElement('div');
            const angle = (Math.PI * 2 * i) / 12;
            const dist = 30 + Math.random() * 20;
            el.style.cssText = `
                position: fixed; left: ${canvas.getBoundingClientRect().left + cx}px; top: ${canvas.getBoundingClientRect().top + cy}px;
                width: 6px; height: 6px; border-radius: 50%; background: ${color};
                pointer-events: none; z-index: 999;
            `;
            container.appendChild(el);
            const anim = el.animate([
                { transform: 'translate(0,0) scale(1)', opacity: 1 },
                { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
            ], { duration: 600, easing: 'ease-out' });
            anim.onfinish = () => el.remove();
        }
    }

    function spawnDeathParticles() {
        const rect = canvas.getBoundingClientRect();
        snake.forEach((seg, i) => {
            setTimeout(() => {
                const step = rect.width / TILE_COUNT;
                spawnParticles(seg.x * step + step/2, seg.y * step + step/2, i === 0 ? '#ff6b6b' : '#00ff88');
            }, i * 30);
        });
    }

    function showFloat(x, y, text, color) {
        const el = document.createElement('div');
        el.className = 'float-score';
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.color = color || '#00ff88';
        document.getElementById('game-area').appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    // ========== 音效/振动 ==========
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (!settings.sound) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'eat') {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'powerup') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
    }
    function vibrate(ms) {
        if (settings.vibrate && navigator.vibrate) navigator.vibrate(ms);
    }

    // ========== 排行榜 ==========
    async function loadLeaderboard(period) {
        document.querySelectorAll('.lb-tab').forEach(t => t.classList.toggle('active', t.dataset.period === period));
        const list = document.getElementById('lb-list');
        list.innerHTML = '<div class="lb-empty">加载中...</div>';

        try {
            const res = await fetch(`${API_BASE}/api/leaderboard`);
            const result = await res.json();
            if (result.success) {
                let data = result.data.map(item => ({
                    name: item.name || '匿名',
                    score: parseInt(item.score) || 0,
                    time: item.created_at || item.time || 0
                }));
                // 按时间筛选（如果服务器不返回时间，就无法筛选）
                const now = Date.now();
                if (period === 'today') {
                    data = data.filter(d => now - (d.time * 1000 || 0) < 86400000);
                } else if (period === 'week') {
                    data = data.filter(d => now - (d.time * 1000 || 0) < 604800000);
                }
                data.sort((a, b) => b.score - a.score);
                renderLbList(data.slice(0, 50));
            } else {
                list.innerHTML = '<div class="lb-empty">暂无数据</div>';
            }
        } catch (e) {
            list.innerHTML = '<div class="lb-empty">加载失败</div>';
        }
    }
    function renderLbList(data) {
        const list = document.getElementById('lb-list');
        if (data.length === 0) {
            list.innerHTML = '<div class="lb-empty">还没有人上榜</div>';
            return;
        }
        list.innerHTML = data.map((item, i) => {
            const rc = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'other';
            return `
                <div class="lb-item">
                    <div class="lb-rank ${rc}">${i + 1}</div>
                    <div class="lb-name">${escapeHtml(item.name)}</div>
                    <div class="lb-score">${item.score}</div>
                </div>
            `;
        }).join('');
    }
    function switchLb(p) { loadLeaderboard(p); }

    // ========== 提交分数 ==========
    async function submitScore() {
        const name = document.getElementById('playerNameInput').value.trim();
        if (!name || name.length > 10) { alert('请输入1-10个字符的名字'); return; }
        try {
            const res = await fetch(`${API_BASE}/api/leaderboard`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, score })
            });
            const result = await res.json();
            if (result.success) {
                alert('提交成功！排名 #' + result.rank);
            }
        } catch (e) { console.error(e); }
        showPage('page-home');
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // ========== 控制 ==========
    document.addEventListener('keydown', e => {
        const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
        if (map[e.key]) {
            e.preventDefault();
            const [ndx, ndy] = map[e.key];
            if (ndx !== -dx || ndy !== -dy) { dx = ndx; dy = ndy; }
            if (!gameRunning && !gameOverFlag && currentPage === 'page-game') resumeGame();
        }
        if (e.key === ' ' || e.key === 'p') {
            if (currentPage === 'page-game') togglePause();
        }
    });

    // 虚拟方向键
    document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
        btn.addEventListener('click', e => {
            e.preventDefault();
            const dir = btn.dataset.dir;
            const map = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
            const [ndx, ndy] = map[dir];
            if (ndx !== -dx || ndy !== -dy) { dx = ndx; dy = ndy; }
            if (!gameRunning && !gameOverFlag && currentPage === 'page-game') resumeGame();
        });
    });

    // 滑动控制
    let tsX = 0, tsY = 0;
    document.addEventListener('touchstart', e => {
        tsX = e.touches[0].clientX;
        tsY = e.touches[0].clientY;
        if (!gameRunning && !gameOverFlag && currentPage === 'page-game') resumeGame();
    }, { passive: true });
    document.addEventListener('touchmove', e => {
        if (gameRunning) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', e => {
        if (!gameRunning || gameOverFlag || currentPage !== 'page-game') return;
        const dtx = e.changedTouches[0].clientX - tsX;
        const dty = e.changedTouches[0].clientY - tsY;
        if (Math.abs(dtx) < 30 && Math.abs(dty) < 30) return;
        if (Math.abs(dtx) > Math.abs(dty)) {
            if (dtx > 0 && dx !== -1) { dx = 1; dy = 0; }
            else if (dtx < 0 && dx !== 1) { dx = -1; dy = 0; }
        } else {
            if (dty > 0 && dy !== -1) { dx = 0; dy = 1; }
            else if (dty < 0 && dy !== 1) { dx = 0; dy = -1; }
        }
    }, { passive: true });

    // ========== 初始化 ==========
    initBgParticles();
    loadSettings();
    updateHomeStats();
    </script>
</body>
</html>
