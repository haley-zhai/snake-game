<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>贪吃蛇大作战</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00ccff;
            --accent: #ff6b6b;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(90deg, rgba(0,255,136,0.1), rgba(0,204,255,0.1));
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .online-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #888;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-mini {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--bg-card);
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }

        .avatar-mini {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        /* 分数区域 */
        .score-section {
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            background: var(--bg-card);
            margin: 8px 12px;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .score-value.high {
            color: #ffd700;
        }

        .score-value.rank {
            color: var(--secondary);
        }

        /* 游戏画布区域 */
        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 12px;
            min-height: 0;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,255,136,0.2);
        }

        #gameCanvas {
            display: block;
            background: #000;
            max-width: 100%;
            max-height: 100%;
        }

        /* 游戏状态提示 */
        .game-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-hint.show {
            opacity: 1;
        }

        .game-hint-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .game-hint-sub {
            font-size: 12px;
            color: #888;
        }

        /* 底部控制栏 */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .ctrl-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
        }

        .ctrl-btn.secondary {
            background: var(--bg-card);
            color: #fff;
            border: 1px solid var(--border);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        /* 方向键控制区 */
        .dpad-section {
            padding: 8px 12px 16px;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 50px);
            gap: 4px;
        }

        .dpad-btn {
            width: 70px;
            height: 50px;
            border: none;
            background: var(--bg-card);
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
            user-select: none;
        }

        .dpad-btn:active {
            background: rgba(0,255,136,0.3);
            transform: scale(0.95);
        }

        .dpad-btn.up { grid-column: 2; grid-row: 1; }
        .dpad-btn.left { grid-column: 1; grid-row: 2; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; }

        /* 滑动提示 */
        .swipe-hint {
            text-align: center;
            padding: 4px;
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-card);
            border-radius: 50%;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:active {
            background: rgba(255,255,255,0.1);
        }

        .final-score-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .final-score-value {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .name-input-section {
            margin-bottom: 20px;
        }

        .name-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        .name-input::placeholder {
            color: #666;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 排行榜列表 */
        .leaderboard-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .leaderboard-rank {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .leaderboard-rank.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
        .leaderboard-rank.silver { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #000; }
        .leaderboard-rank.bronze { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; }
        .leaderboard-rank.normal { background: var(--bg-card); color: #888; }

        .leaderboard-name {
            flex: 1;
            font-size: 14px;
        }

        .leaderboard-score {
            font-weight: bold;
            color: var(--primary);
        }

        /* 设置面板 */
        .settings-panel {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .setting-chip {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .setting-chip.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: #000;
            font-weight: bold;
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            animation: particle-fade 0.6s ease-out forwards;
        }

        @keyframes particle-fade {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) rotate(180deg); opacity: 0; }
        }

        /* 适应大屏幕 */
        @media (min-height: 700px) {
            .dpad-btn {
                height: 60px;
            }
            .dpad {
                grid-template-rows: repeat(3, 60px);
            }
        }

        @media (max-height: 600px) {
            .score-section {
                padding: 8px 12px;
                margin: 4px 8px;
            }
            .score-value {
                font-size: 20px;
            }
            .dpad-btn {
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部状态栏 -->
    <div class="status-bar">
        <div class="status-left">
            <span class="logo">🐍 贪吃蛇 v3.6</span>
            <span class="online-badge">
                <span class="online-dot"></span>
                <span id="onlineCount">0 人在线</span>
            </span>
        </div>
        <div class="user-mini" onclick="showUserModal()">
            <span class="avatar-mini" id="userAvatar">🎮</span>
            <span id="userName">游客</span>
        </div>
    </div>

    <!-- 分数区域 -->
    <div class="score-section">
        <div class="score-item">
            <div class="score-label">当前分数</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">历史最高</div>
            <div class="score-value high" id="highScore">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">全球排名</div>
            <div class="score-value rank" id="globalRank">-</div>
        </div>
    </div>

    <!-- 游戏区域 -->
    <div class="game-area" id="gameArea">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="350" height="350"></canvas>
            <div class="game-hint" id="gameHint">
                <div class="game-hint-text">点击开始游戏</div>
                <div class="game-hint-sub">或使用方向键 / 滑动</div>
            </div>
        </div>
    </div>

    <!-- 底部控制栏 -->
    <div class="control-bar">
        <button class="ctrl-btn primary" id="startBtn" onclick="startGame()">开始</button>
        <button class="ctrl-btn secondary" onclick="pauseGame()">暂停</button>
        <button class="ctrl-btn secondary" onclick="showLeaderboard()">排行榜</button>
        <button class="ctrl-btn secondary" onclick="toggleSound()">🔊</button>
    </div>

    <!-- 方向键 -->
    <div class="dpad-section">
        <div class="dpad">
            <button class="dpad-btn up" ontouchstart="handleDirection('up')">▲</button>
            <button class="dpad-btn left" ontouchstart="handleDirection('left')">◀</button>
            <button class="dpad-btn right" ontouchstart="handleDirection('right')">▶</button>
            <button class="dpad-btn down" ontouchstart="handleDirection('down')">▼</button>
        </div>
    </div>

    <div class="swipe-hint">💡 提示：在屏幕任意位置滑动也可控制方向</div>

    <!-- 游戏结束模态框 -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">💥 游戏结束</span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="final-score-display">
                <div class="final-score-value" id="finalScore">0</div>
            </div>
            <div class="name-input-section">
                <input type="text" class="name-input" id="playerName" placeholder="输入你的名字（2-10个字符）" maxlength="10">
            </div>
            <button class="submit-btn" id="submitBtn" onclick="submitScore()">提交成绩</button>
            <div class="leaderboard-list" id="leaderboardList"></div>
            <button class="ctrl-btn primary" onclick="closeModal(); startGame();" style="width: 100%;">再玩一次</button>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">⚙️ 游戏设置</span>
                <button class="modal-close" onclick="closeSettings()">×</button>
            </div>
            <div style="margin-bottom: 12px; font-size: 13px; color: #888;">难度选择</div>
            <div class="settings-panel">
                <button class="setting-chip active" onclick="setDifficulty('easy')">简单</button>
                <button class="setting-chip" onclick="setDifficulty('normal')">普通</button>
                <button class="setting-chip" onclick="setDifficulty('hard')">困难</button>
            </div>
            <div style="margin-bottom: 12px; font-size: 13px; color: #888;">皮肤主题</div>
            <div class="settings-panel">
                <button class="setting-chip active" onclick="setSkin('classic')">经典</button>
                <button class="setting-chip" onclick="setSkin('neon')">霓虹</button>
                <button class="setting-chip" onclick="setSkin('fire')">火焰</button>
                <button class="setting-chip" onclick="setSkin('ocean')">海洋</button>
            </div>
        </div>
    </div>

    <!-- 排行榜模态框 -->
    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">🏆 全球排行榜</span>
                <button class="modal-close" onclick="closeLeaderboard()">×</button>
            </div>
            <div class="leaderboard-list" id="globalLeaderboard"></div>
        </div>
    </div>

    <div class="particles" id="particles"></div>

    <script>
        // ==================== 游戏配置 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        const skins = {
            classic: { snake: '#00ff88', food: '#ff6b6b', bg: '#000' },
            neon: { snake: '#ff00ff', food: '#00ffff', bg: '#0a0014' },
            fire: { snake: '#ff6600', food: '#ffff00', bg: '#1a0500' },
            ocean: { snake: '#0099ff', food: '#00ffcc', bg: '#000a14' }
        };

        const difficulties = {
            easy: 150,
            normal: 100,
            hard: 60
        };

        // ==================== 游戏状态 ====================
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0;
        let score = 0;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let isGameStarted = false;
        let difficulty = 'easy';
        let skin = 'classic';
        let soundEnabled = true;
        let currentSpeed = difficulties.easy;
        let directionQueue = [];

        // ==================== 音频系统 ====================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'eat') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'die') {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'start') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        function vibrate(ms = 30) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // ==================== 存储管理 ====================
        function getHighScore() {
            return parseInt(localStorage.getItem('snakeHigh_v33') || '0');
        }

        function saveHighScore(s) {
            if (s > getHighScore()) {
                localStorage.setItem('snakeHigh_v33', s);
                return true;
            }
            return false;
        }

        function getUserName() {
            return localStorage.getItem('snakeName') || '';
        }

        function saveUserName(name) {
            localStorage.setItem('snakeName', name);
        }

        // ==================== 游戏核心 ====================
        function drawGame() {
            ctx.fillStyle = skins[skin].bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 蛇
            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? skins[skin].snake : skins[skin].snake + 'aa';
                ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
                
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(seg.x * gridSize + 6, seg.y * gridSize + 6, 2, 2);
                    ctx.fillRect(seg.x * gridSize + 12, seg.y * gridSize + 6, 2, 2);
                }
            });

            // 食物
            ctx.fillStyle = skins[skin].food;
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateGame() {
            if (isPaused || isGameOver) return;

            // 处理方向队列 - 每帧只处理一个方向
            if (directionQueue.length > 0) {
                const dir = directionQueue.shift();
                dx = dir.dx;
                dy = dir.dy;
            }

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 撞自己检测 - 优化：只检查身体部分
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                animateScore();
                createParticles(head.x * gridSize + gridSize/2, head.y * gridSize + gridSize/2, 'eat');
                playSound('eat');
                vibrate(20);
                
                // 加速机制：每吃5个食物加速
                if (score % 50 === 0) {
                    currentSpeed = Math.max(50, currentSpeed - 5);
                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, currentSpeed);
                }
                
                placeFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function placeFood() {
            let attempts = 0;
            let f;
            do {
                f = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                attempts++;
            } while (attempts < 100 && snake.some(s => s.x === f.x && s.y === f.y));
            food = f;
        }

        function gameOver() {
            isGameOver = true;
            isGameStarted = false;
            clearInterval(gameLoop);
            playSound('die');
            vibrate([50, 50, 100]);
            
            const isNewRecord = saveHighScore(score);
            const highScore = getHighScore();
            document.getElementById('highScore').textContent = highScore;
            
            // 显示分数动画
            const finalScoreEl = document.getElementById('finalScore');
            finalScoreEl.textContent = score;
            if (isNewRecord) {
                finalScoreEl.innerHTML = score + '<div style="font-size:16px;color:#ffd700;margin-top:8px;">🎉 新纪录！</div>';
            }
            
            // 计算排名
            loadLeaderboard();
            const rank = leaderboardData.findIndex(item => item.score <= score) + 1;
            if (rank > 0) {
                document.getElementById('globalRank').textContent = '#' + rank;
            }
            
            // 预填充名字
            const savedName = getUserName();
            const nameInput = document.getElementById('playerName');
            if (savedName) {
                nameInput.value = savedName;
            }
            
            showLeaderboardInModal();
            document.getElementById('gameOverModal').classList.add('show');
            document.getElementById('startBtn').textContent = '开始';
            
            // 如果已登录自动提交
            if (savedName && score > 0) {
                setTimeout(() => submitScore(), 500);
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            directionQueue = [];
            score = 0;
            isGameOver = false;
            isPaused = false;
            isGameStarted = true;
            currentSpeed = difficulties[difficulty];
            
            document.getElementById('score').textContent = '0';
            document.getElementById('startBtn').textContent = '重开';
            document.getElementById('gameHint').classList.remove('show');
            
            playSound('start');
            placeFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, currentSpeed);
            drawGame();
        }

        function pauseGame() {
            if (isGameOver || !isGameStarted) return;
            isPaused = !isPaused;
            const hint = document.getElementById('gameHint');
            if (isPaused) {
                hint.querySelector('.game-hint-text').textContent = '游戏暂停';
                hint.querySelector('.game-hint-sub').textContent = '点击继续按钮恢复';
                hint.classList.add('show');
            } else {
                hint.classList.remove('show');
            }
        }

        // ==================== 输入处理 ====================
        function handleDirection(dir) {
            vibrate(15);
            
            if (!isGameStarted && !isGameOver) {
                const dirs = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
                dx = dirs[dir][0];
                dy = dirs[dir][1];
                startGame();
                return;
            }
            
            if (isGameOver || isPaused || !isGameStarted) return;
            
            let newDx = dx, newDy = dy;
            switch(dir) {
                case 'up': if (dy === 0) { newDx = 0; newDy = -1; } break;
                case 'down': if (dy === 0) { newDx = 0; newDy = 1; } break;
                case 'left': if (dx === 0) { newDx = -1; newDy = 0; } break;
                case 'right': if (dx === 0) { newDx = 1; newDy = 0; } break;
            }
            
            if (directionQueue.length < 2 && (newDx !== dx || newDy !== dy)) {
                directionQueue.push({ dx: newDx, dy: newDy });
            }
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
                'w': 'up', 's': 'down', 'a': 'left', 'd': 'right',
                'W': 'up', 'S': 'down', 'A': 'left', 'D': 'right'
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                handleDirection(keyMap[e.key]);
            } else if (e.key === ' ') {
                e.preventDefault();
                if (isGameStarted) pauseGame();
                else startGame();
            }
        });

        // 全局触摸滑动控制 - 优化版
        let touchStartX = 0, touchStartY = 0;
        let touchStartTime = 0;
        const minSwipe = 25;
        const maxTapTime = 200;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, {passive: true});
        
        document.addEventListener('touchmove', (e) => {
            // 防止页面滚动，只允许游戏控制
            if (isGameStarted && !isPaused && !isGameOver) {
                e.preventDefault();
            }
        }, {passive: false});
        
        document.addEventListener('touchend', (e) => {
            const touchDuration = Date.now() - touchStartTime;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            
            // 快速点击不触发方向控制
            if (touchDuration < maxTapTime && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                return;
            }
            
            if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                handleDirection(dx > 0 ? 'right' : 'left');
            } else {
                handleDirection(dy > 0 ? 'down' : 'up');
            }
        }, {passive: false});

        // ==================== UI 控制 ====================
        function closeModal() {
            document.getElementById('gameOverModal').classList.remove('show');
        }

        function showLeaderboard() {
            showLeaderboardInModal();
            document.getElementById('leaderboardModal').classList.add('show');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').classList.remove('show');
        }

        function showSettings() {
            document.getElementById('settingsModal').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            event.target.textContent = soundEnabled ? '🔊' : '🔇';
        }

        function setDifficulty(d) {
            difficulty = d;
            currentSpeed = difficulties[d];
            document.querySelectorAll('.setting-chip').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === 
                    (d === 'easy' ? '简单' : d === 'normal' ? '普通' : '困难'));
            });
        }

        function setSkin(s) {
            skin = s;
            document.querySelectorAll('.setting-chip').forEach(btn => {
                const skinMap = { classic: '经典', neon: '霓虹', fire: '火焰', ocean: '海洋' };
                btn.classList.toggle('active', btn.textContent === skinMap[s]);
            });
            drawGame();
        }

        function showUserModal() {
            showSettings();
        }

        // ==================== 排行榜 ====================
        let leaderboardData = [];

        function loadLeaderboard() {
            // 模拟排行榜数据
            leaderboardData = [
                { name: '蛇王', score: 500 },
                { name: '贪吃鬼', score: 420 },
                { name: '小蛇蛇', score: 350 },
                { name: '新手', score: 280 },
                { name: '练习中', score: 200 }
            ];
            const saved = localStorage.getItem('snakeScores_v33');
            if (saved) {
                const local = JSON.parse(saved);
                leaderboardData = [...local, ...leaderboardData].sort((a,b) => b.score - a.score).slice(0, 10);
            }
        }

        function showLeaderboardInModal() {
            loadLeaderboard();
            const list = document.getElementById('leaderboardList') || document.getElementById('globalLeaderboard');
            let html = '';
            leaderboardData.slice(0, 5).forEach((item, i) => {
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
                html += `
                    <div class="leaderboard-item">
                        <div class="leaderboard-rank ${rankClass}">${i + 1}</div>
                        <div class="leaderboard-name">${item.name}</div>
                        <div class="leaderboard-score">${item.score}</div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function submitScore() {
            const name = document.getElementById('playerName').value.trim();
            if (name.length < 2 || name.length > 10) {
                alert('请输入2-10个字符的名字');
                return;
            }
            saveUserName(name);
            
            const scores = JSON.parse(localStorage.getItem('snakeScores_v33') || '[]');
            scores.push({ name, score, time: Date.now() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem('snakeScores_v33', JSON.stringify(scores.slice(0, 20)));
            
            document.getElementById('submitBtn').textContent = '已提交 ✓';
            document.getElementById('submitBtn').disabled = true;
            showLeaderboardInModal();
            
            setTimeout(() => {
                document.getElementById('submitBtn').textContent = '提交成绩';
                document.getElementById('submitBtn').disabled = false;
            }, 2000);
        }

        // ==================== 粒子效果 - 增强版 ====================
        function createParticles(x, y, type = 'normal') {
            const container = document.getElementById('particles');
            const rect = canvas.getBoundingClientRect();
            const count = type === 'eat' ? 8 : 6;
            const colors = type === 'eat' ? [skins[skin].food, '#fff'] : [skins[skin].food];
            
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = (rect.left + x) + 'px';
                p.style.top = (rect.top + y) + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.width = (4 + Math.random() * 4) + 'px';
                p.style.height = p.style.width;
                
                const angle = (360 / count) * i + Math.random() * 30;
                const distance = 20 + Math.random() * 30;
                p.style.transform = `rotate(${angle}deg) translateX(${distance}px)`;
                
                container.appendChild(p);
                setTimeout(() => p.remove(), 500 + Math.random() * 200);
            }
        }

        // 分数增加动画
        function animateScore() {
            const scoreEl = document.getElementById('score');
            scoreEl.style.transform = 'scale(1.3)';
            scoreEl.style.transition = 'transform 0.1s';
            setTimeout(() => {
                scoreEl.style.transform = 'scale(1)';
            }, 100);
        }

        // ==================== 初始化 ====================
        document.getElementById('highScore').textContent = getHighScore();
        document.getElementById('gameHint').classList.add('show');
        
        const savedName = getUserName();
        if (savedName) {
            document.getElementById('userName').textContent = savedName;
        }
        
        loadLeaderboard();
        drawGame();
    </script>
</body>
</html>
