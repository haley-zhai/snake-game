<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇大作战</title>
    <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@2.9.0/dist/cloudbase.full.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .info-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .info-box .label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .info-box .value { font-size: 24px; font-weight: bold; color: #00ff88; }
        .game-area {
            position: relative;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            border: 2px solid rgba(0,255,136,0.2);
        }
        canvas {
            display: block;
            width: 100%;
            border-radius: 8px;
            background: #0a0a0f;
        }
        .overlay {
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            background: rgba(0,0,0,0.85);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .overlay.hidden { display: none; }
        .btn-start {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            cursor: pointer;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .btn.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,255,0.3));
            border-color: #00ff88;
        }
        .leaderboard {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .leaderboard h3 { margin-bottom: 12px; font-size: 18px; }
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .rank-num {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            margin-right: 12px;
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; }
        .rank-other { background: rgba(255,255,255,0.1); color: #888; }
        .rank-name { flex: 1; }
        .rank-score { font-weight: bold; color: #00ff88; }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            border: 1px solid rgba(0,255,136,0.3);
        }
        .modal-content h2 { margin-bottom: 16px; }
        .final-score { font-size: 48px; font-weight: bold; color: #00ff88; margin-bottom: 20px; }
        .modal-content input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐍 贪吃蛇大作战</h1>
        </div>

        <div class="game-info">
            <div class="info-box">
                <div class="label">得分</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="info-box">
                <div class="label">最高分</div>
                <div class="value" id="highScore">0</div>
            </div>
            <div class="info-box">
                <div class="label">排名</div>
                <div class="value" id="myRank">-</div>
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="350" height="350"></canvas>
            <div class="overlay" id="overlay">
                <div style="font-size: 64px;">🐍</div>
                <div style="color: #888;">点击开始或滑动屏幕</div>
                <button class="btn-start" onclick="startGame()">开始游戏</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn active" onclick="setDifficulty('easy')">简单</button>
            <button class="btn" onclick="setDifficulty('normal')">普通</button>
            <button class="btn" onclick="setDifficulty('hard')">困难</button>
        </div>

        <div class="leaderboard">
            <h3>🏆 排行榜</h3>
            <div id="leaderboardList">
                <div style="text-align: center; padding: 40px; color: #666;">加载中...</div>
            </div>
        </div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>💥 游戏结束</h2>
            <div class="final-score" id="finalScore">0</div>
            <input type="text" id="playerName" placeholder="输入名字" maxlength="10">
            <button class="btn-submit" onclick="submitScore()">提交成绩</button>
        </div>
    </div>

    <script>
        // ========== 腾讯云配置 ==========
        const CLOUDBASE_ENV = 'snake-game-5gvtkwf262c3ddc4';
        let cloudApp = null, cloudDb = null, isCloudReady = false;
        let leaderboardData = [];

        async function initCloud() {
            if (isCloudReady) return true;
            try {
                if (typeof cloudbase === 'undefined') {
                    console.error('腾讯云SDK未加载');
                    return false;
                }
                cloudApp = cloudbase.init({ env: CLOUDBASE_ENV });
                await cloudApp.auth().anonymousAuthProvider().signIn();
                cloudDb = cloudApp.database();
                isCloudReady = true;
                console.log('腾讯云连接成功');
                return true;
            } catch (e) {
                console.error('腾讯云初始化失败:', e.message);
                return false;
            }
        }

        async function loadLeaderboard() {
            const ready = await initCloud();
            if (!ready || !cloudDb) {
                // 云端不可用，显示空状态
                leaderboardData = [];
                renderLeaderboard();
                return;
            }
            try {
                console.log('开始查询排行榜...');
                const { data } = await cloudDb.collection('leaderboard')
                    .orderBy('score', 'desc').limit(10).get();
                console.log('查询结果:', data);
                leaderboardData = data.map(item => ({
                    name: item.name || '匿名',
                    score: parseInt(item.score) || 0
                }));
                console.log('处理后的数据:', leaderboardData);
                renderLeaderboard();
            } catch (e) {
                console.error('加载排行榜失败', e);
                leaderboardData = [];
                renderLeaderboard();
            }
        }

        async function submitToCloud(name, score) {
            await initCloud();
            if (!cloudDb) return null;
            try {
                await cloudDb.collection('leaderboard').add({
                    name, score, timestamp: Date.now(),
                    date: new Date().toLocaleString('zh-CN')
                });
                await loadLeaderboard();
                const rank = leaderboardData.findIndex(i => i.name === name) + 1;
                return rank > 0 ? rank : null;
            } catch (e) { return null; }
        }

        function renderLeaderboard() {
            const list = document.getElementById('leaderboardList');
            if (leaderboardData.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">还没有人上榜</div>';
                return;
            }
            list.innerHTML = leaderboardData.map((item, i) => {
                const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-other';
                return `
                    <div class="leaderboard-item">
                        <div class="rank-num ${rankClass}">${i + 1}</div>
                        <div class="rank-name">${escapeHtml(item.name)}</div>
                        <div class="rank-score">${item.score}</div>
                    </div>
                `;
            }).join('');
        }

        // ========== 游戏核心 ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 20, TILE_COUNT = 17;
        
        let snake = [], food = {}, dx = 1, dy = 0, score = 0;
        let gameLoop = null, isGameOver = false, isPlaying = false;
        let difficulty = 'easy', speed = 150;

        const speeds = { easy: 150, normal: 100, hard: 60 };

        function draw() {
            // 背景
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, 350, 350);
            
            // 网格
            ctx.strokeStyle = 'rgba(0,255,136,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, 350);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(350, i * GRID_SIZE);
                ctx.stroke();
            }

            // 蛇
            snake.forEach((seg, i) => {
                const x = seg.x * GRID_SIZE, y = seg.y * GRID_SIZE;
                ctx.fillStyle = i === 0 ? '#00ff88' : `rgba(0,255,136,${0.8 - i * 0.03})`;
                ctx.shadowBlur = i === 0 ? 10 : 0;
                ctx.shadowColor = '#00ff88';
                ctx.fillRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
            ctx.shadowBlur = 0;

            // 食物
            const fx = food.x * GRID_SIZE + GRID_SIZE/2;
            const fy = food.y * GRID_SIZE + GRID_SIZE/2;
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(fx, fy, GRID_SIZE/2 - 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function update() {
            if (isGameOver) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞墙
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 撞自己
            for (let seg of snake) {
                if (head.x === seg.x && head.y === seg.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHigh', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function placeFood() {
            let f;
            do {
                f = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
            } while (snake.some(s => s.x === f.x && s.y === f.y));
            food = f;
        }

        function startGame() {
            snake = [{ x: 5, y: 5 }];
            dx = 1; dy = 0;
            score = 0;
            isGameOver = false;
            isPlaying = true;
            document.getElementById('score').textContent = '0';
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('gameOverModal').classList.remove('show');
            placeFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
            draw();
        }

        function gameOver() {
            isGameOver = true;
            isPlaying = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').classList.add('show');
        }

        function setDifficulty(d) {
            difficulty = d;
            speed = speeds[d];
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function submitScore() {
            const name = document.getElementById('playerName').value.trim();
            if (!name || name.length > 10) {
                alert('请输入1-10个字符的名字');
                return;
            }
            const rank = await submitToCloud(name, score);
            if (rank) document.getElementById('myRank').textContent = '#' + rank;
            document.getElementById('gameOverModal').classList.remove('show');
            document.getElementById('overlay').classList.remove('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 控制 ==========
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                ArrowUp: [0, -1], ArrowDown: [0, 1],
                ArrowLeft: [-1, 0], ArrowRight: [1, 1],
                w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                const [ndx, ndy] = keyMap[e.key];
                if (ndx !== -dx || ndy !== -dy) { dx = ndx; dy = ndy; }
                if (!isPlaying && !isGameOver) startGame();
            }
        });

        // 触屏控制
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            if (!isPlaying && !isGameOver) startGame();
        }, { passive: true });

        document.addEventListener('touchmove', e => {
            if (isPlaying) e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', e => {
            if (!isPlaying) return;
            const dx1 = e.changedTouches[0].clientX - touchStartX;
            const dy1 = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx1) < 30 && Math.abs(dy1) < 30) return;
            
            if (Math.abs(dx1) > Math.abs(dy1)) {
                if (dx1 > 0 && dx !== -1) { dx = 1; dy = 0; }
                else if (dx1 < 0 && dx !== 1) { dx = -1; dy = 0; }
            } else {
                if (dy1 > 0 && dy !== -1) { dx = 0; dy = 1; }
                else if (dy1 < 0 && dy !== 1) { dx = 0; dy = -1; }
            }
        }, { passive: true });

        // ========== 初始化 ==========
        let highScore = parseInt(localStorage.getItem('snakeHigh') || '0');
        document.getElementById('highScore').textContent = highScore;
        draw();
        loadLeaderboard();
    </script>
</body>
</html>
